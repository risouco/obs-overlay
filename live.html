<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ライブ手元ドック</title>
<style>
  :root{--bg:#0f1216;--panel:#171b21;--panel2:#1e242c;--line:#2a3038;--text:#e8ecf1;
    --sub:#8b95a1;--accent:#7c5cff;--live:#ff5a5a;--gift:#ffcf5a;--ok:#5ad1a0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column;
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;}

  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;
    border-bottom:1px solid var(--line);background:var(--panel);}
  .status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--panel2);color:var(--sub);}
  .status.on{background:rgba(255,90,90,.15);color:var(--live);}
  .stat{font-size:13px;color:var(--text);}
  .stat b{font-size:15px;}
  .stat .lbl{font-size:11px;color:var(--sub);margin-right:2px;}
  .title{flex:1;min-width:120px;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--sub);border-radius:8px;
    padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit;}
  .icon-btn:hover{color:var(--text);}

  .feed{flex:1;overflow-y:auto;padding:10px 12px;}
  .row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:baseline;}
  .row .nm{color:var(--sub);font-size:12px;flex-shrink:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .msg{flex:1;word-break:break-word;line-height:1.5;}
  .row.gift{background:rgba(255,207,90,.10);border:1px solid rgba(255,207,90,.35);border-radius:10px;
    padding:8px 10px;margin:6px 0;align-items:center;}
  .row.gift .gicon{width:26px;height:26px;border-radius:6px;flex-shrink:0;background:var(--panel2);object-fit:cover;}
  .row.gift .nm{color:var(--gift);font-weight:700;max-width:none;}
  .row.gift .item{color:var(--gift);font-weight:700;}
  .empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:13px;line-height:1.7;}

  /* 設定パネル */
  .setup{padding:12px;border-bottom:1px solid var(--line);background:var(--panel);}
  .setup label{display:block;font-size:11px;color:var(--sub);margin:0 0 5px;}
  .setup input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;margin-bottom:8px;}
  .setup .btn{background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:700;
    border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .setup .hint{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.6;}
</style>
</head>
<body>
  <div class="setup" id="setup" hidden>
    <label>Worker URL（ツイキャス手元ドック用）</label>
    <input id="apiUrl" placeholder="https://xxxx.workers.dev" autocomplete="off">
    <label>更新間隔（秒）</label>
    <input id="interval" type="number" min="3" max="30" value="5">
    <button class="btn" id="save">接続して保存</button>
    <div class="hint">Worker側で TW_TOKEN（アクセストークン）と TW_USER（自分のID）を設定しておくこと。</div>
  </div>

  <div class="topbar">
    <span class="status" id="status">オフライン</span>
    <span class="stat"><span class="lbl">視聴</span><b id="viewers">–</b></span>
    <span class="stat"><span class="lbl">累計</span><b id="total">–</b></span>
    <span class="stat"><span class="lbl">最大</span><b id="max">–</b></span>
    <span class="stat"><span class="lbl">経過</span><b id="elapsed">–</b></span>
    <span class="title" id="title"></span>
    <button class="icon-btn" id="reload" title="最新に更新">🔄</button>
    <button class="icon-btn" id="toggleSetup">⚙</button>
  </div>

  <div class="feed" id="feed">
    <div class="empty" id="emptyNote">Worker URL を設定すると、コメントとアイテムが流れます。<br>⚙ から設定してください。</div>
  </div>

<script>
(function(){
  "use strict";
  var LS="utawaku-live-cfg";
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  var apiUrl = lsGet(LS+"-url") || "";
  var interval = parseInt(lsGet(LS+"-int")||"5",10) || 5;

  var $=function(id){ return document.getElementById(id); };
  var feed=$("feed"), emptyNote=$("emptyNote");
  var cSlice="", gSlice="", seen={}, timer=null;

  // 設定
  $("apiUrl").value=apiUrl; $("interval").value=interval;
  if(!apiUrl){ $("setup").hidden=false; }
  $("toggleSetup").addEventListener("click", function(){ $("setup").hidden=!$("setup").hidden; });
  $("reload").addEventListener("click", function(){ var u=location.href.replace(/[?#].*$/,""); location.href=u+"?_="+Date.now(); });
  $("save").addEventListener("click", function(){
    apiUrl=$("apiUrl").value.trim();
    interval=Math.max(3, Math.min(30, parseInt($("interval").value,10)||5));
    lsSet(LS+"-url", apiUrl); lsSet(LS+"-int", String(interval));
    $("setup").hidden=true;
    cSlice=""; gSlice=""; seen={}; feed.innerHTML=""; emptyNote=null;
    startLoop();
  });

  function fmtElapsed(s){
    if(!s) return "–";
    var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    return (h>0? h+":" : "") + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
  }
  function atBottom(){ return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60; }
  function scrollDown(){ feed.scrollTop=feed.scrollHeight; }

  function addComment(c){
    if(seen["c"+c.id]) return; seen["c"+c.id]=1;
    var row=document.createElement("div"); row.className="row";
    var nm=document.createElement("span"); nm.className="nm"; nm.textContent=c.name;
    var msg=document.createElement("span"); msg.className="msg"; msg.textContent=c.message;
    row.appendChild(nm); row.appendChild(msg); feed.appendChild(row);
  }
  // フラット/ネストどちらのレスポンスでも拾えるように
  function giftName(g){ return g.item_name || (g.item&&(g.item.name||g.item.title)) || g.itemName || g.item_id || "アイテム"; }
  function giftSender(g){ return g.user_name || g.user_screen_name || (g.user&&(g.user.name||g.user.screen_id)) || g.user_screen_id || g.name || "リスナー"; }
  function giftImage(g){ return g.item_image || (g.item&&g.item.image) || g.itemImage || ""; }
  function addGift(g){
    var gid = g.id!=null ? g.id : (g.item_id+"_"+Math.random());
    if(seen["g"+gid]) return; seen["g"+gid]=1;
    var row=document.createElement("div"); row.className="row gift";
    var img=giftImage(g);
    if(img){ var im=document.createElement("img"); im.className="gicon"; im.src=img; im.alt=""; row.appendChild(im); }
    var body=document.createElement("span"); body.className="msg";
    var who=document.createElement("span"); who.className="nm"; who.textContent="🎁 "+giftSender(g)+" ";
    var it=document.createElement("span"); it.className="item"; it.textContent=giftName(g);
    body.appendChild(who); body.appendChild(it);
    if(g.message){ var mm=document.createElement("div"); mm.style.color="var(--text)"; mm.style.marginTop="3px"; mm.textContent=g.message; body.appendChild(mm); }
    row.appendChild(body); feed.appendChild(row);
  }

  function setStat(d){
    var st=$("status");
    if(d.live){ st.textContent="🔴 LIVE"; st.classList.add("on"); }
    else { st.textContent="⚪ オフライン"; st.classList.remove("on"); }
    $("viewers").textContent = d.live ? d.viewers : "–";
    $("total").textContent   = d.live ? d.total   : "–";
    $("max").textContent     = d.live ? d.max     : "–";
    $("elapsed").textContent = d.live ? fmtElapsed(d.elapsed) : "–";
    $("title").textContent   = d.title || "";
  }

  function poll(){
    if(!apiUrl) return;
    var u=apiUrl + (apiUrl.indexOf("?")>=0?"&":"?") + "c=" + encodeURIComponent(cSlice) + "&g=" + encodeURIComponent(gSlice);
    fetch(u).then(function(r){ return r.json(); }).then(function(d){
      if(d.error){ return; }
      setStat(d);
      var wasBottom=atBottom();
      // コメントは新しい順で来る → 古い順にして追加
      if(d.comments && d.comments.length){ d.comments.slice().reverse().forEach(addComment); if(d.c) cSlice=d.c; }
      if(d.gifts && d.gifts.length){ d.gifts.forEach(addGift); if(d.g) gSlice=d.g; }
      // 古い行を間引き（最大250）
      while(feed.children.length>250){ feed.removeChild(feed.firstChild); }
      if(wasBottom) scrollDown();
    }).catch(function(){});
  }

  function startLoop(){
    if(timer) clearInterval(timer);
    if(!apiUrl) return;
    poll();
    timer=setInterval(poll, interval*1000);
  }

  if(apiUrl) startLoop();
})();
</script>
</body>
</html>
