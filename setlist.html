<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌枠セトリ</title>
<style>
  :root{
    --bg:#12131a;
    --panel:#1b1d27;
    --panel2:#232635;
    --line:#333850;
    --text:#f2f3f8;
    --sub:#9aa0b8;
    --done:#5b6178;
    --now:#ff5aa5;
    --now2:#ff8bc1;
    --next:#4dd6ff;
    --pool:#ffce54;
    --accent:#7c5cff;
    --radius:14px;
    --font:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    /* 表示オーバーレイ用（落ち着いたオシャレ） */
    --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP","Times New Roman",serif;
    --ov-gold:#c9b48a;
    --ov-gold-soft:#d8caa9;
    --ov-ink:#f3efe6;
    --ov-mute:#9d968a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);color:var(--text);}

  /* ============ 操作パネル ============ */
  body.control{background:var(--bg);padding:14px;}
  .ctrl-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;
    position:sticky;top:0;z-index:50;background:var(--bg);padding:8px 0 10px;
    border-bottom:1px solid var(--line);}
  .ctrl-head h1{font-size:17px;font-weight:700;}
  .ctrl-head .hint{font-size:12px;color:var(--sub);}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700;}
  .btn.warn{color:#ff9a9a;}

  .layout{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:760px){.layout{grid-template-columns:260px 1fr;}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;}
  .card h2{font-size:13px;color:var(--sub);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .card h2 .cnt{margin-left:8px;font-size:11px;background:var(--panel2);padding:2px 8px;border-radius:20px;}

  .add-row{display:flex;gap:6px;margin-bottom:10px;}
  .add-row input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;}
  .add-row input:focus{outline:none;border-color:var(--pool);}
  .add-row .genre-in{flex:0 0 110px;}
  select.genre-in{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:8px 8px;font-size:13px;font-family:inherit;}
  select.genre-in:focus{outline:none;border-color:var(--pool);}
  .sort-sel{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--sub);padding:3px 8px;font-size:12px;font-family:inherit;cursor:pointer;}
  .sort-sel:focus{outline:none;border-color:var(--pool);}
  h2 .cnt{margin-left:8px;}
  .genre-presets{display:flex;align-items:center;gap:6px;margin:-4px 0 10px;flex-wrap:wrap;}
  .genre-presets .hint{margin-right:2px;}
  .preset-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
  .preset-btn:hover{border-color:var(--pool);}
  .genre-pill{font-size:10px;font-weight:700;color:#fff;background:var(--line);
    padding:2px 7px;border-radius:20px;cursor:pointer;flex-shrink:0;white-space:nowrap;
    max-width:120px;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
  .genre-pill.empty{background:transparent;border:1px dashed var(--line);color:var(--sub);font-weight:400;}
  .genre-pill:hover{filter:brightness(1.2);}
  .chip .title{cursor:text;}
  .grip{cursor:grab;color:var(--sub);opacity:.45;flex-shrink:0;font-size:15px;
    user-select:none;padding:0 2px;line-height:1;}
  .grip:hover{opacity:.9;}
  .grip:active{cursor:grabbing;}
  .key-badge{font-size:11px;color:var(--sub);background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;cursor:pointer;flex-shrink:0;white-space:nowrap;
    max-width:110px;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
  .key-badge.empty{border-style:dashed;opacity:.5;}
  .key-badge:hover{border-color:var(--pool);color:var(--text);opacity:1;}
  .inline-edit{background:var(--panel);border:1px solid var(--pool);border-radius:6px;
    color:var(--text);font-size:14px;font-family:inherit;padding:4px 8px;width:120px;}
  .inline-edit.wide{flex:1;width:auto;min-width:80px;}

  .cols{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:760px){.cols{grid-template-columns:1fr 1fr 1fr;}}

  .dropzone{min-height:70px;display:flex;flex-direction:column;gap:6px;padding:4px;border-radius:8px;
    transition:background .12s,outline .12s;outline:2px dashed transparent;}
  .dropzone.pool-zone{max-height:60vh;overflow:auto;}
  .dropzone.over{background:rgba(124,92,255,.10);outline-color:var(--accent);}

  .chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
    border-left:4px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;cursor:grab;
    user-select:none;line-height:1.35;}
  .chip:active{cursor:grabbing;}
  .chip.dragging{opacity:.4;}
  .chip .title{flex:1;word-break:break-word;}
  .chip .x{color:var(--sub);cursor:pointer;font-size:15px;padding:0 2px;flex-shrink:0;}
  .chip .x:hover{color:#ff9a9a;}
  .chip-btn{color:var(--sub);cursor:pointer;font-size:14px;padding:0 4px;flex-shrink:0;user-select:none;}
  .chip-btn:hover{color:var(--pool);}
  .chip-btn.add{font-weight:700;font-size:16px;color:var(--next);}
  .chip-btn.add:hover{filter:brightness(1.3);}

  .col-pool .chip{border-left-color:var(--pool);}
  .col-done .chip{border-left-color:var(--done);color:var(--sub);}
  .col-now  .chip{border-left-color:var(--now);background:rgba(255,90,165,.14);}
  .col-next .chip{border-left-color:var(--next);}

  .col-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .col-title.done{color:var(--done);}
  .col-title.now{color:var(--now2);}
  .col-title.next{color:var(--next);}
  .col-title .cnt{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400;}
  .mini-btn{background:transparent;border:1px solid var(--line);color:var(--sub);
    border-radius:6px;font-size:11px;padding:3px 8px;margin-left:8px;cursor:pointer;
    font-family:inherit;font-weight:400;}
  .mini-btn:hover{border-color:#ff9a9a;color:#ff9a9a;}

  .empty{font-size:12px;color:var(--sub);opacity:.6;padding:10px;text-align:center;}
  .toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  /* 公開リンク作成カード */
  .publish-card{margin-top:12px;}
  .publish-card h2 .hint{margin-left:auto;font-weight:400;}
  .pub-genres{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
  .pub-genres .empty-note{font-size:12px;color:var(--sub);opacity:.7;}
  .fchip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);color:var(--text);background:var(--panel2);font-family:inherit;}
  .fchip.on{background:var(--pool);border-color:var(--pool);color:#231d0c;}
  .fchip:hover{filter:brightness(1.08);}
  .pub-actions{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .pub-url{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:8px 10px;font-size:12px;font-family:inherit;margin-bottom:6px;}
  .pub-url:focus{outline:none;border-color:var(--pool);}
  .pub-settings summary{font-size:12px;color:var(--sub);cursor:pointer;margin-bottom:8px;user-select:none;}
  .pub-settings summary:hover{color:var(--text);}

  /* ============ 表示オーバーレイ（落ち着いたオシャレ） ============ */
  body.display{background:transparent;padding:34px 38px;overflow:hidden;
    -webkit-font-smoothing:antialiased;}
  .ov{max-width:440px;
    background:linear-gradient(180deg,rgba(24,22,19,.60),rgba(24,22,19,.42));
    border:1px solid rgba(201,180,138,.20);
    border-radius:6px;padding:26px 28px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .ov-sec{margin-bottom:22px;}
  .ov-sec:last-child{margin-bottom:0;}

  .ov-label{font-size:10.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ov-gold);margin-bottom:11px;display:flex;align-items:center;gap:12px;
    text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .ov-label::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,rgba(201,180,138,.45),rgba(201,180,138,0));}

  /* 今歌ってる */
  .ov-now-title{font-family:var(--serif);font-size:25px;font-weight:500;
    color:var(--ov-ink);line-height:1.3;letter-spacing:.02em;
    padding:1px 0 3px 14px;border-left:2px solid var(--ov-gold-soft);
    text-shadow:0 1px 4px rgba(0,0,0,.55);}
  .ov-now-title + .ov-now-title{margin-top:8px;}
  .ov-now-empty{font-family:var(--serif);font-size:22px;color:var(--ov-mute);
    padding-left:16px;border-left:2px solid rgba(201,180,138,.30);font-style:italic;}

  /* リスト（これから / 歌った） */
  .ov-list{list-style:none;display:flex;flex-direction:column;}
  .ov-list li{font-family:var(--serif);font-size:19px;font-weight:500;
    color:var(--ov-ink);line-height:1.45;letter-spacing:.01em;
    padding:8px 2px;display:flex;gap:14px;align-items:baseline;
    border-bottom:1px solid rgba(255,255,255,.07);
    text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .ov-list li:last-child{border-bottom:none;}
  .ov-list li .num{font-family:var(--font);font-size:12px;font-weight:600;
    color:var(--ov-gold);min-width:16px;letter-spacing:.05em;
    font-variant-numeric:tabular-nums;transform:translateY(-1px);}
  .ov-empty{font-family:var(--serif);font-size:16px;color:var(--ov-mute);
    padding:6px 2px;font-style:italic;border-bottom:none;}

  /* 歌った曲：控えめに沈める */
  .ov-done .ov-list li{font-size:16px;color:var(--ov-mute);opacity:.85;
    border-bottom-color:rgba(255,255,255,.05);}
  .ov-done .ov-list li .num{color:rgba(201,180,138,.55);}

  /* 歌った曲が増えたら自動ロール（上下フェード付き） */
  .ov-done-view{overflow:hidden;}
  .ov-done-view.rolling{
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);}
  .ov-done-view.rolling #ovDone{will-change:transform;}
  @keyframes ovRoll{from{transform:translateY(0);}to{transform:translateY(-50%);}}

  .ov-hidden{display:none;}
</style>
</head>
<body>

<!-- ==================== 操作パネル ==================== -->
<div id="controlView" style="display:none">
  <div class="ctrl-head">
    <h1>🎤 歌枠セトリ 操作パネル</h1>
    <span class="hint">曲をドラッグして「これから／今／歌った」に移動。プールから曲を引っ張ると複製されます。</span>
    <button class="btn primary" id="btnNext">▶ 次の曲へ</button>
    <button class="btn" id="btnBreak">☕ 一旦休憩</button>
    <button class="btn" id="btnReload" title="最新版に読み直す（キャッシュ回避）">🔄 更新</button>
  </div>

  <div class="layout">
    <!-- 歌える曲プール -->
    <div class="card col-pool">
      <h2>⭐ 歌える曲（メモ）
        <select id="poolSort" class="sort-sel" title="並び替え">
          <option value="kana">50音順</option>
          <option value="genre">ジャンル順</option>
          <option value="key">キー順</option>
        </select>
        <span class="cnt" id="poolCnt">0</span>
      </h2>
      <div class="add-row">
        <input id="poolInput" placeholder="曲名を入力して Enter" />
        <select id="poolGenre" class="genre-in"></select>
        <input id="poolGenreNew" class="genre-in" placeholder="新ジャンル" style="display:none" />
        <datalist id="genreList"></datalist>
        <button class="btn" id="poolAdd">追加</button>
      </div>
      <div class="genre-presets">
        <span class="hint">ジャンル：</span>
        <button type="button" class="preset-btn" data-g="昼">☀️ 昼</button>
        <button type="button" class="preset-btn" data-g="夜">🌙 夜</button>
      </div>
      <div class="dropzone pool-zone" data-zone="pool" id="zonePool"></div>
    </div>

    <!-- 3カラム -->
    <div class="cols">
      <div class="card col-next">
        <div class="col-title next">📋 これから歌う<span class="cnt" id="nextCnt">0</span></div>
        <div class="dropzone" data-zone="next" id="zoneNext"></div>
      </div>
      <div class="card col-now">
        <div class="col-title now">🎶 今歌ってる<span class="cnt" id="nowCnt">0</span></div>
        <div class="dropzone" data-zone="now" id="zoneNow"></div>
      </div>
      <div class="card col-done">
        <div class="col-title done">✅ 歌った<span class="cnt" id="doneCnt">0</span><button class="mini-btn" id="btnClearDone" title="歌った曲リストを空にする">初期化</button></div>
        <div class="dropzone" data-zone="done" id="zoneDone"></div>
      </div>
    </div>
  </div>

  <div class="card publish-card">
    <h2>🔗 公開ページのデータ<span class="hint">出すジャンルを選んでコピー</span></h2>
    <div class="pub-genres" id="pubGenres"></div>
    <div class="pub-actions">
      <button class="btn primary" id="btnPublish">📡 公開を更新</button>
      <button class="btn" id="btnExport">データをコピー</button>
      <span class="hint" id="pubCount"></span>
    </div>
    <div class="hint" id="pubHint" style="margin:2px 0 10px;">「公開を更新」で、選んだ曲が公開ページに即反映されます。</div>
    <details class="pub-settings">
      <summary>公開設定（初回だけ）</summary>
      <input class="pub-url" id="pubApi" placeholder="Cloudflare WorkerのURL（https://xxxx.workers.dev）" />
      <input class="pub-url" id="pubToken" type="password" placeholder="書き込み用の合言葉（Workerに設定したもの）" />
      <input class="pub-url" id="pubUrl" readonly placeholder="「データをコピー」の出力（手動用）" />
    </details>
  </div>

  <div class="toolbar">
    <button class="btn warn" id="btnClearAll">全消去（プールも含む）</button>
    <span class="hint" id="syncNote"></span>
  </div>
</div>

<!-- ==================== 表示オーバーレイ ==================== -->
<div id="displayView" class="ov" style="display:none">
  <div class="ov-sec ov-now">
    <div class="ov-label">Now Singing</div>
    <div id="ovNow"></div>
  </div>
  <div class="ov-sec ov-next">
    <div class="ov-label">Up Next</div>
    <ul class="ov-list" id="ovNext"></ul>
  </div>
  <div class="ov-sec ov-done">
    <div class="ov-label">Already Sung</div>
    <div class="ov-done-view" id="ovDoneView">
      <ul class="ov-list" id="ovDone"></ul>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var STORE_KEY = "utawaku-setlist-v1";
  var CHANNEL   = "utawaku-setlist";
  var params = new URLSearchParams(location.search);
  var view = params.get("view") === "display" ? "display" : "control";

  // ---- state ----
  // pool: 歌える曲メモ {id,title,genre} / next,now,done: セッションのリスト {id,title}
  var state = { pool:[], next:[], now:[], done:[] };

  function uid(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // プールの並び替えモード（kana=50音 / genre=ジャンル / key=キー）
  var poolSort = "kana";
  try{ poolSort = localStorage.getItem("utawaku-pool-sort") || "kana"; }catch(e){}
  function grank(g){ return g==="昼"?0 : g==="夜"?1 : 8; }
  function byTitle(a,b){ return String(a.title||"").localeCompare(String(b.title||""), "ja", {numeric:true}); }
  function sortPool(){
    state.pool.sort(function(a,b){
      if(poolSort==="genre"){
        var ga=(a.genres&&a.genres[0])||"", gb=(b.genres&&b.genres[0])||"";
        var r=grank(ga)-grank(gb); if(r) return r;
        var c=ga.localeCompare(gb,"ja"); if(c) return c;
      } else if(poolSort==="key"){
        var ka=a.key||"", kb=b.key||"";
        if(!ka && kb) return 1; if(ka && !kb) return -1;   // 未設定は後ろ
        var ck=ka.localeCompare(kb,"ja",{numeric:true}); if(ck) return ck;
      }
      return byTitle(a,b);
    });
  }
  function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
  function genreColor(g){ return "hsl("+(hashStr(g)%360)+",46%,32%)"; }
  function refreshGenreList(){
    var set={"昼":1,"夜":1}; // 既定候補
    state.pool.forEach(function(s){ (s.genres||[]).forEach(function(g){ if(g) set[g]=1; }); });
    var list=Object.keys(set).sort(function(a,b){ var r=grank(a)-grank(b); return r||a.localeCompare(b,"ja"); });
    // 追加欄のプルダウン
    var sel=document.getElementById("poolGenre");
    if(sel){
      var cur=sel.value;
      sel.innerHTML="";
      var o0=document.createElement("option"); o0.value=""; o0.textContent="ジャンル…"; sel.appendChild(o0);
      list.forEach(function(g){ var o=document.createElement("option"); o.value=g; o.textContent=g; sel.appendChild(o); });
      var on=document.createElement("option"); on.value="__new__"; on.textContent="＋ 新規入力"; sel.appendChild(on);
      sel.value = (cur==="__new__" || list.indexOf(cur)>=0) ? cur : "";
    }
    // ピル編集用のdatalist
    var dl=document.getElementById("genreList");
    if(dl){ dl.innerHTML=""; list.forEach(function(g){ var o=document.createElement("option"); o.value=g; dl.appendChild(o); }); }
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){ var o = JSON.parse(raw);
        state.pool = o.pool||[]; state.next=o.next||[]; state.now=o.now||[]; state.done=o.done||[];
      }
    }catch(e){}
    // 旧データ（単一genre文字列）を genres 配列へ移行
    state.pool.forEach(function(s){
      if(!Array.isArray(s.genres)){ s.genres = s.genre ? [s.genre] : []; }
      if("genre" in s) delete s.genre;
    });
    sortPool();
  }
  var bc = null;
  try{ bc = new BroadcastChannel(CHANNEL); }catch(e){}

  function save(broadcast){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    if(broadcast && bc){ try{ bc.postMessage({type:"state", state:state}); }catch(e){} }
  }

  // 表示側：他ウィンドウからの更新を受信
  if(bc){
    bc.onmessage = function(ev){
      if(ev.data && ev.data.type==="state"){ state = ev.data.state; render(); }
    };
  }
  // localStorage の storage イベントも保険で拾う（同一オリジン別タブ）
  window.addEventListener("storage", function(e){
    if(e.key===STORE_KEY){ load(); render(); }
  });

  // ================= 公開リンク（今日歌える曲） =================
  var pubExcluded = {}; // 外すジャンル。キー=genre文字列（""=ジャンルなし）
  function songGenres(s){ return (s.genres && s.genres.length) ? s.genres : [""]; }
  function poolGenresList(){
    var seen={}, arr=[];
    state.pool.forEach(function(s){ songGenres(s).forEach(function(g){ if(!(g in seen)){seen[g]=1; arr.push(g);} }); });
    arr.sort(function(a,b){ return a.localeCompare(b,"ja"); });
    return arr;
  }
  function selectedPubSongs(){
    // どれか1つでも有効なジャンルを持つ曲を公開
    return state.pool.filter(function(s){ return songGenres(s).some(function(g){ return !pubExcluded[g]; }); });
  }
  function updatePubCount(){
    var el=document.getElementById("pubCount"); if(!el) return;
    el.textContent = selectedPubSongs().length + "曲を公開";
  }
  function buildPubGenres(){
    var box=document.getElementById("pubGenres"); if(!box) return;
    box.innerHTML="";
    var gs=poolGenresList();
    if(!gs.length){ box.innerHTML='<span class="empty-note">歌える曲を追加すると、ここにジャンルが出ます。</span>'; updatePubCount(); return; }
    gs.forEach(function(g){
      var c=document.createElement("button");
      c.className="fchip"+(pubExcluded[g]?"":" on");
      c.textContent = g==="" ? "（ジャンルなし）" : g;
      c.addEventListener("click", function(){ pubExcluded[g]=!pubExcluded[g]; buildPubGenres(); });
      box.appendChild(c);
    });
    updatePubCount();
  }
  function encodeData(obj){
    return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));
  }
  // 公開用ペイロード：各曲 [曲名, 有効ジャンル配列]（除外ジャンルは落とす）
  function pubSongsPayload(){
    return selectedPubSongs().map(function(s){
      var gs = songGenres(s).filter(function(g){ return g!=="" && !pubExcluded[g]; });
      return [s.title, gs];
    });
  }
  function makePublicUrl(){
    var origin = location.href.replace(/[?#].*$/,"");
    var base = origin.replace(/[^/]*$/, "songs.html");
    return base + "#d=" + encodeData({ s: pubSongsPayload() });
  }
  function fallbackCopy(inputEl){ if(!inputEl) return; inputEl.focus(); inputEl.select(); try{document.execCommand("copy");}catch(e){} }
  function copyText(t, inputEl){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).catch(function(){ fallbackCopy(inputEl); });
    } else { fallbackCopy(inputEl); }
  }

  // ================= 操作パネル =================
  function findList(zone){ return state[zone]; }

  // クリックした要素をその場で入力欄に変えて編集（prompt不要＝OBS内でも安定）
  function inlineEdit(spanEl, chipEl, value, listId, onCommit, wide){
    chipEl.draggable = false;
    var input = document.createElement("input");
    input.className = "inline-edit" + (wide ? " wide" : "");
    input.value = value || "";
    if(listId) input.setAttribute("list", listId);
    input.addEventListener("mousedown", function(e){ e.stopPropagation(); });
    input.addEventListener("click", function(e){ e.stopPropagation(); });
    spanEl.replaceWith(input);
    input.focus(); try{ input.select(); }catch(e){}
    var finished=false;
    function finish(commit){
      if(finished) return; finished=true;
      if(commit) onCommit(input.value.trim());
      renderControl();
    }
    input.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); finish(true); }
      else if(e.key==="Escape"){ e.preventDefault(); finish(false); }
    });
    input.addEventListener("blur", function(){ finish(true); });
  }

  function makeChip(item, zone){
    var el = document.createElement("div");
    el.className = "chip";
    el.draggable = false;
    el.dataset.id = item.id;
    el.dataset.zone = zone;

    // ドラッグ用グリップ（ここを掴んで移動。他の場所はクリックで編集できる）
    var grip=document.createElement("span"); grip.className="grip"; grip.textContent="⠿"; grip.title="ドラッグで移動";
    grip.addEventListener("mousedown", function(){
      el.draggable=true;
      var off=function(){ el.draggable=false; window.removeEventListener("mouseup", off); };
      window.addEventListener("mouseup", off);
    });
    el.appendChild(grip);

    // ジャンルピル（プールのみ・最大3つ・クリックで変更/空欄で削除・「＋」で追加）
    if(zone==="pool"){
      if(!Array.isArray(item.genres)) item.genres = item.genre ? [item.genre] : [];
      item.genres.forEach(function(g, idx){
        var pill=document.createElement("span");
        pill.className="genre-pill";
        pill.textContent=g;
        pill.style.background=genreColor(g);
        pill.title="クリックで変更（空欄にすると削除）";
        pill.addEventListener("click", function(ev){
          ev.stopPropagation();
          inlineEdit(pill, el, g, "genreList", function(v){
            if(v){ item.genres[idx]=v; }
            else { item.genres.splice(idx,1); }
            // 重複除去
            item.genres = item.genres.filter(function(x,i){ return x && item.genres.indexOf(x)===i; });
            save(true); refreshGenreList();
          });
        });
        el.appendChild(pill);
      });
      if(item.genres.length < 3){
        var addp=document.createElement("span");
        addp.className="genre-pill empty";
        addp.textContent="＋";
        addp.title="ジャンルを追加（最大3つ）";
        addp.addEventListener("click", function(ev){
          ev.stopPropagation();
          inlineEdit(addp, el, "", "genreList", function(v){
            if(v && item.genres.indexOf(v)<0 && item.genres.length<3){ item.genres.push(v); }
            save(true); refreshGenreList();
          });
        });
        el.appendChild(addp);
      }
    }

    // 曲名（クリックで改名）
    var t = document.createElement("span"); t.className="title"; t.textContent=item.title;
    t.title="クリックで曲名を編集";
    t.addEventListener("click", function(ev){
      ev.stopPropagation();
      inlineEdit(t, el, item.title, null, function(v){
        if(v){ item.title=v; if(zone==="pool") sortPool(); save(true); }
      }, true);
    });
    el.appendChild(t);

    // キーのメモ（プールのみ・曲名の右）
    if(zone==="pool"){
      var key=document.createElement("span");
      key.className="key-badge"+(item.key?"":" empty");
      key.textContent=item.key||"キー";
      key.title="クリックでキーをメモ（例: +2 / -1 / 原キー）";
      key.addEventListener("click", function(ev){
        ev.stopPropagation();
        inlineEdit(key, el, item.key||"", null, function(v){
          item.key=v; save(true);
        });
      });
      el.appendChild(key);
    }

    // 曲名コピー（これから/今：YouTube検索などに貼る用）
    if((zone==="next" || zone==="now") && !item.brk){
      var cp=document.createElement("span"); cp.className="chip-btn"; cp.textContent="⧉"; cp.title="曲名をコピー";
      cp.addEventListener("click", function(ev){
        ev.stopPropagation(); copyPlain(item.title);
        cp.textContent="✓"; setTimeout(function(){ cp.textContent="⧉"; }, 900);
      });
      el.appendChild(cp);
    }
    // 歌える曲 → これから歌う に追加
    if(zone==="pool"){
      var toNext=document.createElement("span"); toNext.className="chip-btn add"; toNext.textContent="→"; toNext.title="これから歌うに追加";
      toNext.addEventListener("click", function(ev){
        ev.stopPropagation(); state.next.push({id:uid(), title:item.title}); save(true); render();
      });
      el.appendChild(toNext);
    }

    // 削除
    var x = document.createElement("span"); x.className="x"; x.textContent="×"; x.title="削除";
    x.addEventListener("click", function(ev){
      ev.stopPropagation();
      var arr = findList(zone);
      var i = arr.findIndex(function(s){return s.id===item.id;});
      if(i>-1){ arr.splice(i,1); save(true); render(); }
    });
    el.appendChild(x);

    el.addEventListener("dragstart", function(ev){
      el.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", JSON.stringify({id:item.id, from:zone, title:item.title}));
    });
    el.addEventListener("dragend", function(){ el.classList.remove("dragging"); el.draggable=false; });
    return el;
  }

  function renderZone(zoneName, elId){
    var box = document.getElementById(elId);
    box.innerHTML = "";
    var arr = state[zoneName];
    if(arr.length===0){
      var e = document.createElement("div"); e.className="empty";
      e.textContent = zoneName==="pool" ? "ここに歌える曲をためる" : "ドラッグで移動";
      box.appendChild(e);
    }
    arr.forEach(function(item){ box.appendChild(makeChip(item, zoneName)); });
  }

  function renderControl(){
    renderZone("pool","zonePool");
    renderZone("next","zoneNext");
    renderZone("now","zoneNow");
    renderZone("done","zoneDone");
    document.getElementById("poolCnt").textContent = state.pool.length;
    document.getElementById("nextCnt").textContent = state.next.length;
    document.getElementById("nowCnt").textContent  = state.now.length;
    document.getElementById("doneCnt").textContent = state.done.length;
    buildPubGenres();
  }

  // ドロップ処理
  function setupDropzones(){
    document.querySelectorAll(".dropzone").forEach(function(zone){
      var zoneName = zone.dataset.zone;
      zone.addEventListener("dragover", function(ev){ ev.preventDefault(); zone.classList.add("over"); });
      zone.addEventListener("dragleave", function(){ zone.classList.remove("over"); });
      zone.addEventListener("drop", function(ev){
        ev.preventDefault(); zone.classList.remove("over");
        var data;
        try{ data = JSON.parse(ev.dataTransfer.getData("text/plain")); }catch(e){ return; }
        if(!data) return;
        var from = data.from, to = zoneName;

        // どの位置に挿入するか（ドロップ先の一番近いchipの前）
        var insertIdx = getInsertIndex(zone, ev.clientY);

        if(from==="pool" && to!=="pool"){
          // プール → セッション列：複製（プールは残す）
          insertItem(to, {id:uid(), title:data.title}, insertIdx);
        } else if(from===to){
          // 同一列で並び替え
          reorder(to, data.id, insertIdx);
        } else {
          // 列間の移動
          moveItem(from, to, data.id, insertIdx);
        }
        save(true); render();
      });
    });
  }

  function getInsertIndex(zone, y){
    var chips = Array.prototype.slice.call(zone.querySelectorAll(".chip:not(.dragging)"));
    for(var i=0;i<chips.length;i++){
      var r = chips[i].getBoundingClientRect();
      if(y < r.top + r.height/2) return i;
    }
    return chips.length;
  }
  function insertItem(zoneName, item, idx){
    var arr = state[zoneName];
    if(idx==null||idx>arr.length) idx=arr.length;
    arr.splice(idx,0,item);
  }
  function removeById(zoneName, id){
    var arr = state[zoneName];
    var i = arr.findIndex(function(s){return s.id===id;});
    if(i>-1) return arr.splice(i,1)[0];
    return null;
  }
  function reorder(zoneName, id, idx){
    var item = removeById(zoneName, id);
    if(item) insertItem(zoneName, item, idx);
  }
  function moveItem(from, to, id, idx){
    var item = removeById(from, id);
    if(item) insertItem(to, item, idx);
  }

  // 「次の曲へ」：今→歌った（歌った順に末尾追加＝1番が最初に歌った曲）、これからの先頭→今
  function nextSong(){
    if(state.now.length){ state.now.forEach(function(s){ if(!s.brk) state.done.push(s); }); state.now=[]; }
    if(state.next.length){ state.now = [ state.next.shift() ]; }
    save(true); render();
  }
  // 「一旦休憩」：今の曲を歌ったに送り、今を「休憩中」に
  function takeBreak(){
    if(state.now.length){ state.now.forEach(function(s){ if(!s.brk) state.done.push(s); }); state.now=[]; }
    state.now = [ {id:uid(), title:"☕ 休憩中", brk:true} ];
    save(true); render();
  }
  // 平文をクリップボードにコピー（YouTube検索用など）
  function copyPlain(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){ execCopy(text); });
    } else { execCopy(text); }
  }
  function execCopy(text){
    var ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta);
  }

  // ================= 表示オーバーレイ =================
  function renderDisplay(){
    var nowBox = document.getElementById("ovNow");
    nowBox.innerHTML = "";
    if(state.now.length){
      state.now.forEach(function(s){
        var d=document.createElement("div"); d.className="ov-now-title"; d.textContent=s.title; nowBox.appendChild(d);
      });
    }else{
      var e=document.createElement("div"); e.className="ov-now-empty"; e.textContent="— 準備中 —"; nowBox.appendChild(e);
    }

    var nextUl = document.getElementById("ovNext"); nextUl.innerHTML="";
    if(state.next.length){
      state.next.forEach(function(s,i){
        var li=document.createElement("li");
        var n=document.createElement("span"); n.className="num"; n.textContent=(i+1);
        var t=document.createElement("span"); t.textContent=s.title;
        li.appendChild(n); li.appendChild(t); nextUl.appendChild(li);
      });
    }else{
      var le=document.createElement("li"); le.className="ov-empty"; le.textContent="—"; nextUl.appendChild(le);
    }

    var doneView = document.getElementById("ovDoneView");
    var doneUl = document.getElementById("ovDone");
    doneUl.innerHTML=""; doneUl.style.animation="";
    document.querySelector(".ov-done").style.display = state.done.length? "block":"none";
    var mkDone=function(s,i){
      var li=document.createElement("li");
      var n=document.createElement("span"); n.className="num"; n.textContent=(i+1);
      var t=document.createElement("span"); t.textContent=s.title;
      li.appendChild(n); li.appendChild(t); return li;
    };
    state.done.forEach(function(s,i){ doneUl.appendChild(mkDone(s,i)); });
    // 3曲以上でシームレスに縦ロール（リストを複製して循環）
    var ROLL_MIN=2; // これを超えたら＝3曲以上
    doneView.style.maxHeight="";
    if(state.done.length > ROLL_MIN){
      // 単一セットの実寸から、常に1行以上はみ出す高さを算出（少数曲でもキレイに循環）
      var rowH = doneUl.firstChild ? doneUl.firstChild.getBoundingClientRect().height : 40;
      var oneCopyH = doneUl.getBoundingClientRect().height || (state.done.length*rowH);
      var visRows = Math.min(state.done.length - 1, 6); // 見える行数（最大6行）
      var viewH = Math.min(visRows*rowH, oneCopyH - 1);
      doneView.style.maxHeight = Math.round(viewH) + "px";
      // シームレスループ用に複製
      state.done.forEach(function(s,i){ doneUl.appendChild(mkDone(s,i)); });
      doneView.classList.add("rolling");
      var dur = Math.max(9, state.done.length*2.4); // ゆっくりめ
      doneUl.style.animation = "ovRoll "+dur+"s linear infinite";
    } else {
      doneView.classList.remove("rolling");
    }
  }

  // ================= 共通 =================
  function render(){ if(view==="control") renderControl(); else renderDisplay(); }

  function initControl(){
    document.getElementById("controlView").style.display="block";
    document.body.classList.add("control");
    setupDropzones();

    var input=document.getElementById("poolInput");
    var genreSel=document.getElementById("poolGenre");
    var genreNew=document.getElementById("poolGenreNew");
    function currentGenre(){
      if(!genreSel) return "";
      if(genreSel.value==="__new__"){ return (genreNew.value||"").trim(); }
      return genreSel.value;
    }
    function addPool(){
      var v=input.value.trim(); if(!v) return;
      var g=currentGenre();
      state.pool.push({id:uid(), title:v, genres: g ? [g] : []});
      input.value="";
      sortPool(); save(true); renderControl(); refreshGenreList();
      if(g && genreSel){ genreSel.value=g; }        // 入れたジャンルを選択のまま（連続入力を楽に）
      if(genreNew){ genreNew.value=""; genreNew.style.display="none"; }
      input.focus();
    }
    document.getElementById("poolAdd").addEventListener("click", addPool);
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") addPool(); });
    if(genreNew){ genreNew.addEventListener("keydown", function(e){ if(e.key==="Enter") addPool(); }); }
    if(genreSel){
      genreSel.addEventListener("change", function(){
        if(genreSel.value==="__new__"){ genreNew.style.display=""; genreNew.focus(); }
        else { genreNew.style.display="none"; }
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll(".preset-btn"), function(b){
      b.addEventListener("click", function(){
        if(genreSel){ genreSel.value=b.dataset.g; }
        if(genreNew){ genreNew.style.display="none"; }
        input.focus();
      });
    });
    // 並び替え
    var sortSel=document.getElementById("poolSort");
    if(sortSel){
      sortSel.value=poolSort;
      sortSel.addEventListener("change", function(){
        poolSort=sortSel.value;
        try{ localStorage.setItem("utawaku-pool-sort", poolSort); }catch(e){}
        sortPool(); save(true); renderControl();
      });
    }
    refreshGenreList();

    document.getElementById("btnNext").addEventListener("click", nextSong);
    document.getElementById("btnBreak").addEventListener("click", takeBreak);
    document.getElementById("btnReload").addEventListener("click", function(){
      var u=new URL(location.href); u.searchParams.set("_", Date.now()); location.href=u.toString();
    });
    document.getElementById("btnClearDone").addEventListener("click", function(){
      if(!state.done.length) return;
      if(confirm("「歌った曲」リストを空にします。よろしいですか？")){
        state.done=[]; save(true); renderControl();
      }
    });
    document.getElementById("btnClearAll").addEventListener("click", function(){
      if(confirm("プールも含めて全部消します。取り消せません。よろしいですか？")){
        state={pool:[],next:[],now:[],done:[]}; save(true); renderControl();
      }
    });
    document.getElementById("btnExport").addEventListener("click", function(){
      var songs=pubSongsPayload();
      if(!songs.length){ alert("公開する曲がありません。ジャンルを選ぶか、歌える曲を追加してください。"); return; }
      var json=JSON.stringify({ s: songs });
      var out=document.getElementById("pubUrl"); out.value=json;
      copyText(json, out);
      document.getElementById("pubHint").textContent=songs.length+"曲ぶんのデータをコピーしました（手動更新用）。";
    });

    // 公開設定（Worker URL・合言葉）を保存・復元
    var apiI=document.getElementById("pubApi"), tokI=document.getElementById("pubToken");
    apiI.value=localStorage.getItem("utawaku-pub-api")||"";
    tokI.value=localStorage.getItem("utawaku-pub-token")||"";
    apiI.addEventListener("change", function(){ localStorage.setItem("utawaku-pub-api", apiI.value.trim()); });
    tokI.addEventListener("change", function(){ localStorage.setItem("utawaku-pub-token", tokI.value.trim()); });

    document.getElementById("btnPublish").addEventListener("click", function(){
      var songs=pubSongsPayload();
      if(!songs.length){ alert("公開する曲がありません。ジャンルを選ぶか、歌える曲を追加してください。"); return; }
      var api=apiI.value.trim(), token=tokI.value.trim();
      if(!api){ document.querySelector(".pub-settings").open=true; alert("先に「公開設定」でWorkerのURLを入れてください（初回だけ）。"); return; }
      var hint=document.getElementById("pubHint"); hint.textContent="送信中…";
      fetch(api, {method:"POST", headers:{"Content-Type":"application/json","X-Token":token}, body:JSON.stringify({s:songs})})
        .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
        .then(function(){ hint.textContent="✅ "+songs.length+"曲で公開を更新しました（ページに即反映）。"; })
        .catch(function(e){ hint.textContent="⚠️ 更新失敗: "+e.message+"（URL・合言葉を確認）"; });
    });
    document.getElementById("syncNote").textContent =
      "※ 表示は setlist.html?view=display を開いた画面に自動で反映されます。";
    renderControl();
  }

  function initDisplay(){
    document.getElementById("displayView").style.display="block";
    document.body.classList.add("display");
    renderDisplay();
    // 表示を開いたときに最新状態を要求
    if(bc){ try{ bc.postMessage({type:"request"}); }catch(e){} }
  }
  // 操作側は request に応じて現状態を返す
  if(bc){
    var prev = bc.onmessage;
    bc.onmessage = function(ev){
      if(ev.data && ev.data.type==="request" && view==="control"){ save(true); return; }
      if(prev) prev(ev);
    };
  }

  load();
  if(view==="control") initControl(); else initDisplay();
})();
</script>
