<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌枠セトリ</title>
<style>
  :root{
    --bg:#12131a;
    --panel:#1b1d27;
    --panel2:#232635;
    --line:#333850;
    --text:#f2f3f8;
    --sub:#9aa0b8;
    --done:#5b6178;
    --now:#ff5aa5;
    --now2:#ff8bc1;
    --next:#4dd6ff;
    --pool:#ffce54;
    --accent:#7c5cff;
    --radius:14px;
    --font:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    /* 表示オーバーレイ用（落ち着いたオシャレ） */
    --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP","Times New Roman",serif;
    --ov-gold:#c9b48a;
    --ov-gold-soft:#d8caa9;
    --ov-ink:#f3efe6;
    --ov-mute:#9d968a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);color:var(--text);}

  /* ============ 操作パネル ============ */
  body.control{background:var(--bg);padding:14px;}
  .ctrl-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .ctrl-head h1{font-size:17px;font-weight:700;}
  .ctrl-head .hint{font-size:12px;color:var(--sub);}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700;}
  .btn.warn{color:#ff9a9a;}

  .layout{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:760px){.layout{grid-template-columns:260px 1fr;}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;}
  .card h2{font-size:13px;color:var(--sub);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .card h2 .cnt{margin-left:auto;font-size:11px;background:var(--panel2);padding:2px 8px;border-radius:20px;}

  .add-row{display:flex;gap:6px;margin-bottom:10px;}
  .add-row input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:8px 10px;font-size:13px;font-family:inherit;}
  .add-row input:focus{outline:none;border-color:var(--pool);}

  .cols{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:760px){.cols{grid-template-columns:1fr 1fr 1fr;}}

  .dropzone{min-height:70px;display:flex;flex-direction:column;gap:6px;padding:4px;border-radius:8px;
    transition:background .12s,outline .12s;outline:2px dashed transparent;}
  .dropzone.pool-zone{max-height:60vh;overflow:auto;}
  .dropzone.over{background:rgba(124,92,255,.10);outline-color:var(--accent);}

  .chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
    border-left:4px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;cursor:grab;
    user-select:none;line-height:1.35;}
  .chip:active{cursor:grabbing;}
  .chip.dragging{opacity:.4;}
  .chip .title{flex:1;word-break:break-word;}
  .chip .x{color:var(--sub);cursor:pointer;font-size:15px;padding:0 2px;flex-shrink:0;}
  .chip .x:hover{color:#ff9a9a;}

  .col-pool .chip{border-left-color:var(--pool);}
  .col-done .chip{border-left-color:var(--done);color:var(--sub);}
  .col-now  .chip{border-left-color:var(--now);background:rgba(255,90,165,.14);}
  .col-next .chip{border-left-color:var(--next);}

  .col-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .col-title.done{color:var(--done);}
  .col-title.now{color:var(--now2);}
  .col-title.next{color:var(--next);}
  .col-title .cnt{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400;}
  .mini-btn{background:transparent;border:1px solid var(--line);color:var(--sub);
    border-radius:6px;font-size:11px;padding:3px 8px;margin-left:8px;cursor:pointer;
    font-family:inherit;font-weight:400;}
  .mini-btn:hover{border-color:#ff9a9a;color:#ff9a9a;}

  .empty{font-size:12px;color:var(--sub);opacity:.6;padding:10px;text-align:center;}
  .toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

  /* ============ 表示オーバーレイ（落ち着いたオシャレ） ============ */
  body.display{background:transparent;padding:34px 38px;overflow:hidden;
    -webkit-font-smoothing:antialiased;}
  .ov{max-width:440px;
    background:linear-gradient(180deg,rgba(24,22,19,.60),rgba(24,22,19,.42));
    border:1px solid rgba(201,180,138,.20);
    border-radius:6px;padding:26px 28px 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.35);}
  .ov-sec{margin-bottom:22px;}
  .ov-sec:last-child{margin-bottom:0;}

  .ov-label{font-size:10.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;
    color:var(--ov-gold);margin-bottom:11px;display:flex;align-items:center;gap:12px;
    text-shadow:0 1px 2px rgba(0,0,0,.5);}
  .ov-label::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,rgba(201,180,138,.45),rgba(201,180,138,0));}

  /* 今歌ってる */
  .ov-now-title{font-family:var(--serif);font-size:33px;font-weight:500;
    color:var(--ov-ink);line-height:1.3;letter-spacing:.02em;
    padding:2px 0 4px 16px;border-left:2px solid var(--ov-gold-soft);
    text-shadow:0 1px 4px rgba(0,0,0,.55);}
  .ov-now-title + .ov-now-title{margin-top:8px;}
  .ov-now-empty{font-family:var(--serif);font-size:22px;color:var(--ov-mute);
    padding-left:16px;border-left:2px solid rgba(201,180,138,.30);font-style:italic;}

  /* リスト（これから / 歌った） */
  .ov-list{list-style:none;display:flex;flex-direction:column;}
  .ov-list li{font-family:var(--serif);font-size:19px;font-weight:500;
    color:var(--ov-ink);line-height:1.45;letter-spacing:.01em;
    padding:8px 2px;display:flex;gap:14px;align-items:baseline;
    border-bottom:1px solid rgba(255,255,255,.07);
    text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .ov-list li:last-child{border-bottom:none;}
  .ov-list li .num{font-family:var(--font);font-size:12px;font-weight:600;
    color:var(--ov-gold);min-width:16px;letter-spacing:.05em;
    font-variant-numeric:tabular-nums;transform:translateY(-1px);}
  .ov-empty{font-family:var(--serif);font-size:16px;color:var(--ov-mute);
    padding:6px 2px;font-style:italic;border-bottom:none;}

  /* 歌った曲：控えめに沈める */
  .ov-done .ov-list li{font-size:16px;color:var(--ov-mute);opacity:.85;
    border-bottom-color:rgba(255,255,255,.05);}
  .ov-done .ov-list li .num{color:rgba(201,180,138,.55);}

  /* 歌った曲が増えたら自動ロール（上下フェード付き） */
  .ov-done-view{overflow:hidden;}
  .ov-done-view.rolling{max-height:246px;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);}
  .ov-done-view.rolling #ovDone{will-change:transform;}
  @keyframes ovRoll{from{transform:translateY(0);}to{transform:translateY(-50%);}}

  .ov-hidden{display:none;}
</style>
</head>
<body>

<!-- ==================== 操作パネル ==================== -->
<div id="controlView" style="display:none">
  <div class="ctrl-head">
    <h1>🎤 歌枠セトリ 操作パネル</h1>
    <span class="hint">曲をドラッグして「これから／今／歌った」に移動。プールから曲を引っ張ると複製されます。</span>
    <button class="btn primary" id="btnNext">▶ 次の曲へ</button>
  </div>

  <div class="layout">
    <!-- 歌える曲プール -->
    <div class="card col-pool">
      <h2>⭐ 歌える曲（メモ）<span class="cnt" id="poolCnt">0</span></h2>
      <div class="add-row">
        <input id="poolInput" placeholder="曲名を入力して Enter" />
        <button class="btn" id="poolAdd">追加</button>
      </div>
      <div class="dropzone pool-zone" data-zone="pool" id="zonePool"></div>
    </div>

    <!-- 3カラム -->
    <div class="cols">
      <div class="card col-next">
        <div class="col-title next">📋 これから歌う<span class="cnt" id="nextCnt">0</span></div>
        <div class="dropzone" data-zone="next" id="zoneNext"></div>
      </div>
      <div class="card col-now">
        <div class="col-title now">🎶 今歌ってる<span class="cnt" id="nowCnt">0</span></div>
        <div class="dropzone" data-zone="now" id="zoneNow"></div>
      </div>
      <div class="card col-done">
        <div class="col-title done">✅ 歌った<span class="cnt" id="doneCnt">0</span><button class="mini-btn" id="btnClearDone" title="歌った曲リストを空にする">初期化</button></div>
        <div class="dropzone" data-zone="done" id="zoneDone"></div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn warn" id="btnClearAll">全消去（プールも含む）</button>
    <span class="hint" id="syncNote"></span>
  </div>
</div>

<!-- ==================== 表示オーバーレイ ==================== -->
<div id="displayView" class="ov" style="display:none">
  <div class="ov-sec ov-now">
    <div class="ov-label">Now Singing</div>
    <div id="ovNow"></div>
  </div>
  <div class="ov-sec ov-next">
    <div class="ov-label">Up Next</div>
    <ul class="ov-list" id="ovNext"></ul>
  </div>
  <div class="ov-sec ov-done">
    <div class="ov-label">Already Sung</div>
    <div class="ov-done-view" id="ovDoneView">
      <ul class="ov-list" id="ovDone"></ul>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var STORE_KEY = "utawaku-setlist-v1";
  var CHANNEL   = "utawaku-setlist";
  var params = new URLSearchParams(location.search);
  var view = params.get("view") === "display" ? "display" : "control";

  // ---- state ----
  // pool: 歌える曲メモ / next,now,done: セッションのリスト。要素 = {id, title}
  var state = { pool:[], next:[], now:[], done:[] };

  function uid(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){ var o = JSON.parse(raw);
        state.pool = o.pool||[]; state.next=o.next||[]; state.now=o.now||[]; state.done=o.done||[];
      }
    }catch(e){}
  }
  var bc = null;
  try{ bc = new BroadcastChannel(CHANNEL); }catch(e){}

  function save(broadcast){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    if(broadcast && bc){ try{ bc.postMessage({type:"state", state:state}); }catch(e){} }
  }

  // 表示側：他ウィンドウからの更新を受信
  if(bc){
    bc.onmessage = function(ev){
      if(ev.data && ev.data.type==="state"){ state = ev.data.state; render(); }
    };
  }
  // localStorage の storage イベントも保険で拾う（同一オリジン別タブ）
  window.addEventListener("storage", function(e){
    if(e.key===STORE_KEY){ load(); render(); }
  });

  // ================= 操作パネル =================
  function findList(zone){ return state[zone]; }

  function makeChip(item, zone){
    var el = document.createElement("div");
    el.className = "chip";
    el.draggable = true;
    el.dataset.id = item.id;
    el.dataset.zone = zone;
    var t = document.createElement("span"); t.className="title"; t.textContent=item.title;
    var x = document.createElement("span"); x.className="x"; x.textContent="×"; x.title="削除";
    x.addEventListener("click", function(ev){
      ev.stopPropagation();
      var arr = findList(zone);
      var i = arr.findIndex(function(s){return s.id===item.id;});
      if(i>-1){ arr.splice(i,1); save(true); render(); }
    });
    el.appendChild(t); el.appendChild(x);

    el.addEventListener("dragstart", function(ev){
      el.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", JSON.stringify({id:item.id, from:zone, title:item.title}));
    });
    el.addEventListener("dragend", function(){ el.classList.remove("dragging"); });
    return el;
  }

  function renderZone(zoneName, elId){
    var box = document.getElementById(elId);
    box.innerHTML = "";
    var arr = state[zoneName];
    if(arr.length===0){
      var e = document.createElement("div"); e.className="empty";
      e.textContent = zoneName==="pool" ? "ここに歌える曲をためる" : "ドラッグで移動";
      box.appendChild(e);
    }
    arr.forEach(function(item){ box.appendChild(makeChip(item, zoneName)); });
  }

  function renderControl(){
    renderZone("pool","zonePool");
    renderZone("next","zoneNext");
    renderZone("now","zoneNow");
    renderZone("done","zoneDone");
    document.getElementById("poolCnt").textContent = state.pool.length;
    document.getElementById("nextCnt").textContent = state.next.length;
    document.getElementById("nowCnt").textContent  = state.now.length;
    document.getElementById("doneCnt").textContent = state.done.length;
  }

  // ドロップ処理
  function setupDropzones(){
    document.querySelectorAll(".dropzone").forEach(function(zone){
      var zoneName = zone.dataset.zone;
      zone.addEventListener("dragover", function(ev){ ev.preventDefault(); zone.classList.add("over"); });
      zone.addEventListener("dragleave", function(){ zone.classList.remove("over"); });
      zone.addEventListener("drop", function(ev){
        ev.preventDefault(); zone.classList.remove("over");
        var data;
        try{ data = JSON.parse(ev.dataTransfer.getData("text/plain")); }catch(e){ return; }
        if(!data) return;
        var from = data.from, to = zoneName;

        // どの位置に挿入するか（ドロップ先の一番近いchipの前）
        var insertIdx = getInsertIndex(zone, ev.clientY);

        if(from==="pool" && to!=="pool"){
          // プール → セッション列：複製（プールは残す）
          insertItem(to, {id:uid(), title:data.title}, insertIdx);
        } else if(from===to){
          // 同一列で並び替え
          reorder(to, data.id, insertIdx);
        } else {
          // 列間の移動
          moveItem(from, to, data.id, insertIdx);
        }
        save(true); render();
      });
    });
  }

  function getInsertIndex(zone, y){
    var chips = Array.prototype.slice.call(zone.querySelectorAll(".chip:not(.dragging)"));
    for(var i=0;i<chips.length;i++){
      var r = chips[i].getBoundingClientRect();
      if(y < r.top + r.height/2) return i;
    }
    return chips.length;
  }
  function insertItem(zoneName, item, idx){
    var arr = state[zoneName];
    if(idx==null||idx>arr.length) idx=arr.length;
    arr.splice(idx,0,item);
  }
  function removeById(zoneName, id){
    var arr = state[zoneName];
    var i = arr.findIndex(function(s){return s.id===id;});
    if(i>-1) return arr.splice(i,1)[0];
    return null;
  }
  function reorder(zoneName, id, idx){
    var item = removeById(zoneName, id);
    if(item) insertItem(zoneName, item, idx);
  }
  function moveItem(from, to, id, idx){
    var item = removeById(from, id);
    if(item) insertItem(to, item, idx);
  }

  // 「次の曲へ」：今→歌った、これからの先頭→今
  function nextSong(){
    if(state.now.length){ state.now.forEach(function(s){ state.done.unshift(s); }); state.now=[]; }
    if(state.next.length){ state.now = [ state.next.shift() ]; }
    save(true); render();
  }

  // ================= 表示オーバーレイ =================
  function renderDisplay(){
    var nowBox = document.getElementById("ovNow");
    nowBox.innerHTML = "";
    if(state.now.length){
      state.now.forEach(function(s){
        var d=document.createElement("div"); d.className="ov-now-title"; d.textContent=s.title; nowBox.appendChild(d);
      });
    }else{
      var e=document.createElement("div"); e.className="ov-now-empty"; e.textContent="— 準備中 —"; nowBox.appendChild(e);
    }

    var nextUl = document.getElementById("ovNext"); nextUl.innerHTML="";
    if(state.next.length){
      state.next.forEach(function(s,i){
        var li=document.createElement("li");
        var n=document.createElement("span"); n.className="num"; n.textContent=(i+1);
        var t=document.createElement("span"); t.textContent=s.title;
        li.appendChild(n); li.appendChild(t); nextUl.appendChild(li);
      });
    }else{
      var le=document.createElement("li"); le.className="ov-empty"; le.textContent="—"; nextUl.appendChild(le);
    }

    var doneView = document.getElementById("ovDoneView");
    var doneUl = document.getElementById("ovDone");
    doneUl.innerHTML=""; doneUl.style.animation="";
    document.querySelector(".ov-done").style.display = state.done.length? "block":"none";
    var mkDone=function(s,i){
      var li=document.createElement("li");
      var n=document.createElement("span"); n.className="num"; n.textContent=(i+1);
      var t=document.createElement("span"); t.textContent=s.title;
      li.appendChild(n); li.appendChild(t); return li;
    };
    state.done.forEach(function(s,i){ doneUl.appendChild(mkDone(s,i)); });
    // 一定数を超えたらシームレスに縦ロール（リストを複製して循環）
    var ROLL_MIN=6;
    if(state.done.length > ROLL_MIN){
      state.done.forEach(function(s,i){ doneUl.appendChild(mkDone(s,i)); });
      doneView.classList.add("rolling");
      var dur = Math.max(12, state.done.length*2.4); // ゆっくりめ
      doneUl.style.animation = "ovRoll "+dur+"s linear infinite";
    } else {
      doneView.classList.remove("rolling");
    }
  }

  // ================= 共通 =================
  function render(){ if(view==="control") renderControl(); else renderDisplay(); }

  function initControl(){
    document.getElementById("controlView").style.display="block";
    document.body.classList.add("control");
    setupDropzones();

    var input=document.getElementById("poolInput");
    function addPool(){
      var v=input.value.trim(); if(!v) return;
      state.pool.push({id:uid(), title:v}); input.value=""; save(true); renderControl();
    }
    document.getElementById("poolAdd").addEventListener("click", addPool);
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") addPool(); });

    document.getElementById("btnNext").addEventListener("click", nextSong);
    document.getElementById("btnClearDone").addEventListener("click", function(){
      if(!state.done.length) return;
      if(confirm("「歌った曲」リストを空にします。よろしいですか？")){
        state.done=[]; save(true); renderControl();
      }
    });
    document.getElementById("btnClearAll").addEventListener("click", function(){
      if(confirm("プールも含めて全部消します。取り消せません。よろしいですか？")){
        state={pool:[],next:[],now:[],done:[]}; save(true); renderControl();
      }
    });
    document.getElementById("syncNote").textContent =
      "※ 表示は setlist.html?view=display を開いた画面に自動で反映されます。";
    renderControl();
  }

  function initDisplay(){
    document.getElementById("displayView").style.display="block";
    document.body.classList.add("display");
    renderDisplay();
    // 表示を開いたときに最新状態を要求
    if(bc){ try{ bc.postMessage({type:"request"}); }catch(e){} }
  }
  // 操作側は request に応じて現状態を返す
  if(bc){
    var prev = bc.onmessage;
    bc.onmessage = function(ev){
      if(ev.data && ev.data.type==="request" && view==="control"){ save(true); return; }
      if(prev) prev(ev);
    };
  }

  load();
  if(view==="control") initControl(); else initDisplay();
})();
</script>
</body>
</html>
